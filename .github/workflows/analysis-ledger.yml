name: Analysis ledger

on:
  pull_request:
    paths:
      - '.github/workflows/analysis-ledger.yml'
      - 'prisma/**'
      - 'src/analysis/**'
      - 'src/analysis-job/**'
      - 'src/analysis-worker/**'
      - 'src/collection/**'
      - 'src/prisma/**'
      - 'test/**'
      - 'docker-compose.yml'
      - 'scripts/localstack/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gitmate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gitmate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      localstack:
        image: localstack/localstack:4.7.0
        env:
          SERVICES: sqs
          AWS_DEFAULT_REGION: us-east-1
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gitmate_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gitmate_test
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT: http://127.0.0.1:4566
      ANALYSIS_JOB_QUEUE_URL: http://127.0.0.1:4566/000000000000/git-mate-analysis-ci.fifo
      ASYNC_ANALYSIS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create LocalStack FIFO queue
        run: >-
          aws --endpoint-url=http://127.0.0.1:4566 sqs create-queue
          --queue-name git-mate-analysis-ci.fifo
          --attributes FifoQueue=true,ContentBasedDeduplication=false
          --region us-east-1
      - run: npx prisma generate
      - run: npm run build
      - run: npm test -- --runInBand
      - run: npm run test:e2e -- --runInBand
        env:
          JWT_SECRET: ci-e2e-only-secret
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          GITHUB_CLIENT_ID: ci-e2e-client-id
          GITHUB_CLIENT_SECRET: ci-e2e-client-secret
          GITHUB_CALLBACK_URL: http://127.0.0.1/auth/github/callback
          GITHUB_APP_ID: '1'
          GITHUB_APP_INSTALL_URL: https://github.com/apps/ci-e2e-test/installations/new
          GITHUB_APP_WEBHOOK_SECRET: ci-e2e-webhook-secret
          GITHUB_APP_PRIVATE_KEY: ci-e2e-private-key
      - run: npm test -- --runInBand src/analysis-job/test/analysis-job.postgres.integration.spec.ts
        env:
          RUN_DATABASE_INTEGRATION_TESTS: 'true'
      - run: npm test -- --runInBand src/analysis-job/test/sqs-analysis-job.integration.spec.ts
        env:
          RUN_SQS_INTEGRATION_TESTS: 'true'
