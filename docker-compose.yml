services:
  api:
    build:
      context: .
      target: builder
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
      - "5555:5555"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/gitmate?schema=public
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - SQS_ENDPOINT=http://localstack:4566
      - ANALYSIS_JOB_QUEUE_URL=http://localstack:4566/000000000000/git-mate-analysis.fifo
      - ANALYSIS_JOB_PUBLISH_MAX_ATTEMPTS=5
      - ANALYSIS_JOB_REPUBLISH_AFTER_SECONDS=60
      - ANALYSIS_JOB_RECONCILE_BATCH_SIZE=20
      - ASYNC_ANALYSIS_ENABLED=false
    env_file:
      - .env
    depends_on:
      db:
        condition: service_started
      localstack:
        condition: service_healthy
    command: npm run start:dev

  db:
    image: postgres:15-alpine
    ports:
      - "6543:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=gitmate
    volumes:
      - postgres_data:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:4.7.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./scripts/localstack:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
